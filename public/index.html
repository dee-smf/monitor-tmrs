<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Transparência - Taxa de Manejo de Resíduos Sólidos</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js" type="module" defer></script>
</head>
<body class="page">

    <!-- Cabeçalho -->
    <header class="header">

    </header>

    <main class="main">

        <div class="controls">
            <div class="controls__inner">
                <div class="controls__group">
                    <label for="viewMode" class="controls__label">Modo de Visualização</label>
                    <select id="viewMode" class="controls__select controls__select--wide">
                        <option value="simple">Mensal</option>
                        <option value="rolling12">Acumulado em 12 Meses</option>
                        <option value="ytd">Acumulado por ano</option>
                    </select>
                </div>

                <div id="yearSelectorContainer" class="controls__group hidden">
                    <label for="yearSelector" class="controls__label">Exercício (Ano)</label>
                    <select id="yearSelector" class="controls__select controls__select--narrow">
                        <!-- Preenchido via JS -->
                    </select>
                </div>
            </div>
        </div>

        <div class="content-grid">
            <!-- Gráfico -->
            <div class="chart-card">
                <h2 class="chart-card__title" id="chartTitle">Evolução Financeira</h2>
                <div class="chart-card__canvas">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Resumo / Tabela -->
            <div class="table-card">
                <div class="table-card__header">
                    <h2 class="table-card__title" id="tableTitle">Detalhamento Tabular</h2>
                </div>
                <div class="table-card__body">
                    <table class="table">
                        <thead class="table__head">
                            <tr>
                                <th scope="col" class="table__header-cell">Período</th>
                                <th scope="col" class="table__header-cell table__header-cell--right">Arrecadado</th>
                                <th scope="col" class="table__header-cell table__header-cell--right">Gasto</th>
                                <th scope="col" class="table__header-cell table__header-cell--right">Resultado</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="table__body">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
